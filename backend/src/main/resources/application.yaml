spring:
  application:
    name: flowpay
  datasource:
    url: ${FLOWPAY_DATABASE_URL:jdbc:postgresql://localhost:5432/flowpay}
    username: ${FLOWPAY_DATABASE_USERNAME:flowpay}
    password: ${FLOWPAY_DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  modulith:
    detection-strategy: explicitly-annotated
server:
  servlet:
    session:
      cookie:
        name: SESSION
        path: /
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
flowpay:
  demo:
    max-active-companies: ${FLOWPAY_DEMO_MAX_ACTIVE_COMPANIES:500}
    cleanup-interval-ms: ${FLOWPAY_DEMO_CLEANUP_INTERVAL_MS:60000}
    cleanup-batch-size: ${FLOWPAY_DEMO_CLEANUP_BATCH_SIZE:50}
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /internal/swagger-ui
    url: /api/openapi.yaml
    disable-swagger-default-url: true
    supported-submit-methods: []
    persist-authorization: false
