spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowpay}
    username: ${SPRING_DATASOURCE_USERNAME:flowpay_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpay_dev_only_local}
flowpay:
  security:
    rate-limit-hmac-key: ${FLOWPAY_RATE_LIMIT_HMAC_KEY:local-only-rate-limit-hmac-key-not-for-production}
  identity:
    registration:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
server:
  servlet:
    session:
      cookie:
        secure: false
