server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true

debug: false
flowpay:
  security:
    rate-limit-hmac-key: ${FLOWPAY_RATE_LIMIT_HMAC_KEY}
    trusted-proxy-cidrs: ${FLOWPAY_TRUSTED_PROXY_CIDRS:}
  identity:
    registration:
      enabled: false
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [request_id=%X{request_id:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.boot: INFO
    org.springframework.jdbc: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

spring:
  application:
    name: flowpay-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
