services:
  db:
    image: postgres:18.7-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpay}
      POSTGRES_USER: ${POSTGRES_USER:-flowpay_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpay_dev_only_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flowpay_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  flowpay_postgres_data:
