name: flowpay

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: flowpay
      POSTGRES_USER: flowpay
      POSTGRES_PASSWORD: ${FLOWPAY_DATABASE_PASSWORD:?Run scripts/setup-local.ps1 or configure .env first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  backend:
    image: flowpay-backend:0.1.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FLOWPAY_DATABASE_URL: jdbc:postgresql://database:5432/flowpay
      FLOWPAY_DATABASE_USERNAME: flowpay
      FLOWPAY_DATABASE_PASSWORD: ${FLOWPAY_DATABASE_PASSWORD:?Configure .env first}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/actuator/health]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    image: flowpay-frontend:0.1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FLOWPAY_LOGIN_RATE: ${FLOWPAY_LOGIN_RATE:-5r/m}
      FLOWPAY_DEMO_RATE: ${FLOWPAY_DEMO_RATE:-2r/m}
    ports:
      - '127.0.0.1:${FLOWPAY_HTTP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 10

  bootstrap:
    image: flowpay-backend:0.1.0
    profiles: [tools]
    environment:
      FLOWPAY_DATABASE_URL: jdbc:postgresql://database:5432/flowpay
      FLOWPAY_DATABASE_USERNAME: flowpay
      FLOWPAY_DATABASE_PASSWORD: ${FLOWPAY_DATABASE_PASSWORD:?Configure .env first}
      SPRING_PROFILES_ACTIVE: local-bootstrap
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      FLOWPAY_BOOTSTRAP_ENABLED: 'true'
      FLOWPAY_BOOTSTRAP_COMPANY_NAME: ${FLOWPAY_BOOTSTRAP_COMPANY_NAME:-}
      FLOWPAY_BOOTSTRAP_EMAIL: ${FLOWPAY_BOOTSTRAP_EMAIL:-}
      FLOWPAY_BOOTSTRAP_PASSWORD: ${FLOWPAY_BOOTSTRAP_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
