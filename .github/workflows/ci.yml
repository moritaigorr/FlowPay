name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven
      - name: Verify with PostgreSQL Testcontainers
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

  frontend-and-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run validate:api
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend

  browser-acceptance:
    runs-on: ubuntu-24.04
    env:
      FLOWPAY_DATABASE_PASSWORD: flowpay-ci-only
      FLOWPAY_HTTP_PORT: '8080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start production-like stack for isolated browser journeys
        env:
          FLOWPAY_DEMO_RATE: 1000r/m
        run: docker compose up --build --detach --wait
      - name: Run browser, API and tenant-isolation journeys
        run: npm run test:e2e
        working-directory: frontend
      - name: Recreate clean stack with default demo rate limit
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --build --detach --wait
      - name: Verify proxy rate limit
        if: always()
        env:
          FLOWPAY_TEST_RATE_LIMIT: '1'
        run: npm run test:e2e -- --grep "returns 429"
        working-directory: frontend
      - name: Stop acceptance stack
        if: always()
        run: docker compose down --volumes --remove-orphans
