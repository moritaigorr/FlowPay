limit_req_zone $binary_remote_addr zone=flowpay_login:10m rate=${FLOWPAY_LOGIN_RATE};
limit_req_zone $binary_remote_addr zone=flowpay_demo:10m rate=${FLOWPAY_DEMO_RATE};
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flowpay_api http://backend:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /api/v1/auth/login {
        limit_req zone=flowpay_login burst=5 nodelay;
        error_page 429 = @too_many_attempts;
        include /etc/nginx/proxy-api.conf;
    }

    location = /api/v1/demo/sessions {
        limit_req zone=flowpay_demo burst=2 nodelay;
        error_page 429 = @too_many_attempts;
        include /etc/nginx/proxy-api.conf;
    }

    location @too_many_attempts {
        default_type text/plain;
        add_header Retry-After 60 always;
        return 429 'Too many attempts. Please try again later.';
    }

    location /api/ { include /etc/nginx/proxy-api.conf; }
    location /swagger-ui/ { include /etc/nginx/proxy-api.conf; }
    location = /swagger-ui.html { include /etc/nginx/proxy-api.conf; }
    location = /actuator/health { include /etc/nginx/proxy-api.conf; }
    location /actuator/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
