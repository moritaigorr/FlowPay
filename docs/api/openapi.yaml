                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Set-Cookie:
              description: "SESSION=<opaque>; Path=/; HttpOnly; SameSite=Lax; Secure in production. Browser-managed; 30-minute inactivity timeout. Login/demo rotate ID; logout expires cookie. Never persisted in idempotency record."
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/demo/sessions":
    post:
      operationId: "createDemoSession"
      tags:
        - "demo"
      summary: "Enter isolated synthetic demo"
      description: "No body. Reuse valid current demo with 200; otherwise create company/operator/fixtures in one transaction, authenticate after commit and return 201. Conventional or expired session may explicitly enter a fresh demo. Rotate session ID and clear CSRF on success; client refreshes token. Serialized global capacity admission; 503 DEMO_CAPACITY_REACHED leaves no partial data."
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      responses:
        "200":
          description: "Valid current demo reused, preserving data and fixed expiry."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Set-Cookie:
              description: "SESSION=<opaque>; Path=/; HttpOnly; SameSite=Lax; Secure in production. Browser-managed; 30-minute inactivity timeout. Login/demo rotate ID; logout expires cookie. Never persisted in idempotency record."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "201":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Set-Cookie:
              description: "SESSION=<opaque>; Path=/; HttpOnly; SameSite=Lax; Secure in production. Browser-managed; 30-minute inactivity timeout. Login/demo rotate ID; logout expires cookie. Never persisted in idempotency record."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/api/v1/company":
    get:
      operationId: "getCompany"
      tags:
        - "company"
      summary: "Get current company"
      description: "Get current company"
      parameters: []
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
