              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Company"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/customers":
    post:
      operationId: "createCustomer"
      tags:
        - "customers"
      summary: "Create customer"
      description: "Email duplicates allowed. Demo company lock covers active check/count/insertion; max 100 customers. 409 DEMO_LIMIT_REACHED; 503 CONTENTION_TIMEOUT. No update/delete API."
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Customer"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "409":
          "$ref": "#/components/responses/Conflict"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
    get:
      operationId: "listCustomers"
      tags:
        - "customers"
      summary: "List company customers"
      description: "Fixed createdAt DESC, id DESC. Search name/email. Empty result totalPages=0; out-of-range page returns empty items with actual totals."
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/Size"
        -
          "$ref": "#/components/parameters/Q"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CustomerPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/payments":
    post:
      operationId: "createPayment"
      tags:
        - "payments"
      summary: "Create or replay payment"
      description: "Authenticate, validate/canonicalize DTO, verify active company; demo locks company before key reservation. INSERT ON CONFLICT DO NOTHING at READ COMMITTED; conflict read in later statement. Hash mismatch ->409 IDEMPOTENCY_KEY_REUSED. Matching replay returns stored 201 JSON and Location even after status changes/quota reached; check replay BEFORE customer existence/quota. Only new reservation validates owned customer (404 CUSTOMER_NOT_FOUND), max 500 demo payments (409 DEMO_LIMIT_REACHED), creates payment/event/stored response atomically. Failure rolls back reservation too. Timeout ->503 CONTENTION_TIMEOUT, retry same key. Fresh requestId headers; never replay session headers."
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[!-~]{1,128}$"
          description: "Case-sensitive printable ASCII without spaces, scoped company + create-payment, retained for company lifetime."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Location:
              description: "Relative /api/v1/payments/{id}; identical on original/replay."
              schema:
                type: "string"
            Idempotency-Replayed:
              description: "Always present, false new / true replay."
              schema:
                type: "boolean"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Payment"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "409":
          "$ref": "#/components/responses/Conflict"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
    get:
      operationId: "listPayments"
      tags:
        - "payments"
      summary: "List filtered payments"
      description: "All supplied filters ANDed; q internally ORs exact payment UUID/name/email. Fixed createdAt DESC,id DESC. Empty/out-of-range behavior matches customer pages."
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/Size"
        -
          "$ref": "#/components/parameters/Q"
        -
          name: "status"
          in: "query"
          schema:
            "$ref": "#/components/schemas/PaymentStatus"
        -
          name: "customerId"
          in: "query"
          schema:
            type: "string"
            format: "uuid"
          description: "Unknown/foreign customer returns empty list."
        -
          "$ref": "#/components/parameters/CreatedFrom"
        -
          "$ref": "#/components/parameters/CreatedTo"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PaymentPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/payments/{id}":
    get:
      operationId: "getPayment"
      tags:
        - "payments"
      summary: "Get current payment"
      description: "Get current payment"
      parameters:
        -
          "$ref": "#/components/parameters/Id"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
