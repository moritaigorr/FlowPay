        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/payments/{id}/events":
    get:
      operationId: "getPaymentEvents"
      tags:
        - "payments"
      summary: "Get immutable history"
      description: "Ascending contiguous sequence from 1. Creation null->PENDING, null reason. Process PENDING->APPROVED/null reason or REJECTED/SIMULATED_DECLINE. Cancel PENDING->CANCELLED/null reason. Actor is authenticated user or synthetic fixture operator. No history mutation."
      parameters:
        -
          "$ref": "#/components/parameters/Id"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/PaymentEvent"
                minItems: 1
                maxItems: 2
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/payments/{id}/process":
    post:
      operationId: "processPayment"
      tags:
        - "payments"
      summary: "Process deterministic simulation"
      description: "No body. Check active company; company lock before payment lock when both required (always demo). Query/lock by payment AND company, recheck PENDING under lock. APPROVE->APPROVED; DECLINE->REJECTED with SIMULATED_DECLINE. Status and event commit atomically. Every final state, including repeated same action, returns 409 PAYMENT_FINAL_STATE. 503 CONTENTION_TIMEOUT may retry but these actions have no response replay."
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
        -
          "$ref": "#/components/parameters/Id"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Payment"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/api/v1/payments/{id}/cancel":
    post:
      operationId: "cancelPayment"
      tags:
        - "payments"
      summary: "Cancel pending payment"
      description: "No body. Check active company; company lock before payment lock when both required (always demo). Query/lock by payment AND company, recheck PENDING under lock. PENDING->CANCELLED. Status and event commit atomically. Every final state, including repeated same action, returns 409 PAYMENT_FINAL_STATE. 503 CONTENTION_TIMEOUT may retry but these actions have no response replay."
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
        -
          "$ref": "#/components/parameters/Id"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Payment"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/api/v1/dashboard/summary":
    get:
      operationId: "getDashboardSummary"
      tags:
        - "dashboard"
      summary: "Get creation-cohort metrics"
      description: "Require from<to; client sends last 30 days UTC instants by default. All metrics use creation [from,to) and current status. approvedVolume sums APPROVED; pending count/amount use PENDING; total includes all states. Approval denominator APPROVED+REJECTED excludes PENDING/CANCELLED. No denominator means null. Metrics may change after processing. No chart endpoint."
      parameters:
        -
          name: "from"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date-time"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DashboardSummary"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/openapi.yaml":
    get:
      operationId: "getOpenApi"
      tags:
        - "documentation"
      summary: "Canonical maintained OpenAPI document."
      description: "Canonical maintained OpenAPI document."
      security: []
      parameters: []
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
          content:
            "application/yaml":
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/docs":
    get:
      operationId: "getApiDocs"
      tags:
        - "documentation"
      summary: "Swagger UI page with interactive execution disabled."
      description: "Swagger UI page with interactive execution disabled."
      security: []
      parameters: []
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
          content:
            "text/html":
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "SESSION"
      description: "Opaque Spring Session JDBC cookie, browser-managed and HttpOnly; never returned in JSON/storage."
  parameters:
    Csrf:
      name: "X-CSRF-TOKEN"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 1
      description: "Token from GET /api/v1/auth/csrf. Required even for anonymous login/demo. Refresh after login/demo/logout."
    Id:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: "size"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Q:
      name: "q"
      in: "query"
      schema:
        type: "string"
        maxLength: 200
      description: "Strip outer whitespace; empty is no filter. Case-insensitive literal substring on customer name/email; payment query also ORs exact parsed payment UUID. SQL wildcards treated literally. U+0000 is invalid and returns 400 VALIDATION_FAILED."
    CreatedFrom:
      name: "createdFrom"
      in: "query"
      schema:
        type: "string"
        format: "date-time"
      description: "Inclusive; optional independently. If both supplied require createdFrom < createdTo."
    CreatedTo:
      name: "createdTo"
      in: "query"
      schema:
        type: "string"
        format: "date-time"
      description: "Exclusive; optional independently."
  responses:
    BadRequest:
      description: "VALIDATION_FAILED: Malformed JSON, unknown request fields, invalid field/header/UUID/date/paging. fieldErrors present for field validation."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: "Bad Request"
            status: 400
            detail: "One or more fields are invalid."
            instance: "/api/v1/payments"
            code: "VALIDATION_FAILED"
            requestId: "6e0fa13d-394b-4d06-9eaf-7664b448082b"
            fieldErrors:
              -
                field: "amount"
                code: "OUT_OF_RANGE"
                message: "Amount must be positive and at most 99999999999999999.99."
    Unauthorized:
      description: "UNAUTHENTICATED / DEMO_EXPIRED: Missing/expired session; demo expiry invalidates session."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: "CSRF_INVALID: Missing/invalid CSRF; obtain a fresh token."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: "CUSTOMER_NOT_FOUND / PAYMENT_NOT_FOUND: Object absent from authenticated company; foreign IDs indistinguishable."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: "IDEMPOTENCY_KEY_REUSED / PAYMENT_FINAL_STATE / DEMO_LIMIT_REACHED: Applicable code depends on operation."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Unavailable:
      description: "CONTENTION_TIMEOUT / DEMO_CAPACITY_REACHED: No partial commit or success assumed."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
        Retry-After:
          description: "Positive seconds until retry; creation retries retain original key/payload."
          schema:
            type: "string"
            pattern: "^[1-9][0-9]*$"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    RateLimited:
      description: "RATE_LIMITED: Proxy login/demo attempt limit. The problem schema describes the normalized case; clients must also handle non-JSON proxy responses and missing headers."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
        Retry-After:
          description: "Positive seconds until retry; creation retries retain original key/payload."
          schema:
            type: "string"
            pattern: "^[1-9][0-9]*$"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    InternalError:
      description: "INTERNAL_ERROR: No stack traces, SQL or personal data."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "UNSUPPORTED_MEDIA_TYPE: Body must be application/json."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    MethodNotAllowed:
      description: "METHOD_NOT_ALLOWED: Unsupported method."
      headers:
        X-Request-Id:
          description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
          schema:
            type: "string"
            format: "uuid"
        Cache-Control:
          description: "Do not cache API identity or business JSON."
          schema:
            type: "string"
            enum:
              - "no-store"
        Allow:
          description: "Permitted methods for this path."
          schema:
            type: "string"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    Name:
      type: "string"
      minLength: 1
      maxLength: 120
      description: "Strip outer Unicode whitespace; nonblank; Unicode code point length after stripping."
    Email:
      type: "string"
      format: "email"
      minLength: 3
      maxLength: 254
      description: "Strip outer Unicode whitespace then lowercase with Locale.ROOT, validate normalized email. Customer duplicates allowed."
    Description:
      type: "string"
      nullable: true
      maxLength: 500
      description: "Strip outer Unicode whitespace; absent/null/empty canonicalize to null; code point length after stripping."
    MoneyInput:
      type: "string"
      pattern: "^(0|[1-9][0-9]{0,16})(\\.[0-9]{1,2})?$"
      maxLength: 20
      description: "Must be >0 and <=99999999999999999.99. Accept 1, 1.0, 1.00 as equivalent strings; normalize scale 2, never round. Reject numeric JSON, exponent, signs, whitespace and separators."
      example: "150.00"
    Money:
      type: "string"
      pattern: "^(0|[1-9][0-9]{0,16})\\.[0-9]{2}$"
      maxLength: 20
      example: "150.00"
    AggregateMoney:
      type: "string"
      pattern: "^(0|[1-9][0-9]*)\\.[0-9]{2}$"
      description: "Nonnegative BRL sum at scale 2; may exceed individual NUMERIC(19,2) bound."
      example: "1200.00"
    PaymentStatus:
      type: "string"
      enum:
        - "PENDING"
        - "APPROVED"
        - "REJECTED"
        - "CANCELLED"
    SimulationScenario:
      type: "string"
      enum:
        - "APPROVE"
        - "DECLINE"
    Company:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "name"
        - "createdAt"
        - "demo"
        - "expiresAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          "$ref": "#/components/schemas/Name"
        createdAt:
          type: "string"
          format: "date-time"
        demo:
          type: "boolean"
        expiresAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Null conventional; demo creation +24 hours."
    User:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "email"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          "$ref": "#/components/schemas/Email"
        createdAt:
          type: "string"
          format: "date-time"
    Session:
      type: "object"
      additionalProperties: false
      required:
        - "user"
        - "company"
      properties:
        user:
          "$ref": "#/components/schemas/User"
        company:
          "$ref": "#/components/schemas/Company"
    CsrfToken:
      type: "object"
      additionalProperties: false
      required:
        - "token"
        - "headerName"
        - "parameterName"
      properties:
        token:
          type: "string"
          minLength: 1
        headerName:
          type: "string"
          enum:
            - "X-CSRF-TOKEN"
        parameterName:
          type: "string"
          enum:
            - "_csrf"
    LoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          "$ref": "#/components/schemas/Email"
        password:
          type: "string"
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: "Never trim/normalize."
    CustomerCreate:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "email"
      properties:
        name:
          "$ref": "#/components/schemas/Name"
        email:
          "$ref": "#/components/schemas/Email"
    Customer:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "name"
        - "email"
        - "createdAt"
        - "updatedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          "$ref": "#/components/schemas/Name"
        email:
          "$ref": "#/components/schemas/Email"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    PaymentCreate:
      type: "object"
      additionalProperties: false
      required:
        - "customerId"
        - "amount"
        - "currency"
        - "simulationScenario"
      properties:
        customerId:
          type: "string"
          format: "uuid"
        amount:
          "$ref": "#/components/schemas/MoneyInput"
        currency:
          type: "string"
          enum:
            - "BRL"
        description:
          "$ref": "#/components/schemas/Description"
        simulationScenario:
          "$ref": "#/components/schemas/SimulationScenario"
    Payment:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "customerId"
        - "amount"
        - "currency"
        - "status"
        - "description"
        - "simulationScenario"
        - "createdAt"
        - "updatedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        customerId:
          type: "string"
          format: "uuid"
        amount:
          "$ref": "#/components/schemas/Money"
        currency:
          type: "string"
          enum:
            - "BRL"
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        description:
          "$ref": "#/components/schemas/Description"
        simulationScenario:
          "$ref": "#/components/schemas/SimulationScenario"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    PaymentEvent:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "paymentId"
        - "sequence"
        - "previousStatus"
        - "newStatus"
        - "reasonCode"
        - "actorUserId"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        paymentId:
          type: "string"
          format: "uuid"
        sequence:
          type: "integer"
          format: "int64"
          minimum: 1
        previousStatus:
          type: "string"
          nullable: true
          enum:
            - "PENDING"
            - "APPROVED"
            - "REJECTED"
            - "CANCELLED"
            - null
        newStatus:
          "$ref": "#/components/schemas/PaymentStatus"
        reasonCode:
          type: "string"
          nullable: true
          enum:
            - "SIMULATED_DECLINE"
            - null
        actorUserId:
          type: "string"
          format: "uuid"
        createdAt:
          type: "string"
          format: "date-time"
    DashboardSummary:
      type: "object"
      additionalProperties: false
      required:
        - "from"
        - "to"
        - "currency"
        - "approvedVolume"
        - "pendingCount"
        - "pendingAmount"
        - "approvedCount"
        - "rejectedCount"
        - "totalPayments"
        - "approvalRate"
      properties:
        from:
          type: "string"
          format: "date-time"
        to:
          type: "string"
          format: "date-time"
        currency:
          type: "string"
          enum:
            - "BRL"
        approvedVolume:
          "$ref": "#/components/schemas/AggregateMoney"
        pendingCount:
          type: "integer"
          format: "int64"
          minimum: 0
        pendingAmount:
          "$ref": "#/components/schemas/AggregateMoney"
        approvedCount:
          type: "integer"
          format: "int64"
          minimum: 0
        rejectedCount:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPayments:
          type: "integer"
          format: "int64"
          minimum: 0
        approvalRate:
          type: "string"
          nullable: true
          pattern: "^(0\\.[0-9]{4}|1\\.0000)$"
          description: "approvedCount/(approvedCount+rejectedCount), ratio 0..1, HALF_UP scale 4; null for zero denominator, display no data (never 0%). Counts are exact; use decimal-safe formatting."
          example: "0.7500"
    CustomerPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Customer"
        page:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
          maximum: 100
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    PaymentPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Payment"
        page:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
          maximum: 100
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    FieldError:
      type: "object"
      additionalProperties: false
      required:
        - "field"
        - "code"
        - "message"
      properties:
        field:
          type: "string"
        code:
          type: "string"
          enum:
            - "REQUIRED"
            - "INVALID_FORMAT"
            - "OUT_OF_RANGE"
            - "TOO_LONG"
            - "UNKNOWN_FIELD"
        message:
          type: "string"
    Problem:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
        - "requestId"
      properties:
        type:
          type: "string"
          format: "uri"
          enum:
            - "about:blank"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          description: "Path without query string."
        code:
          type: "string"
          enum:
            - "VALIDATION_FAILED"
            - "UNAUTHENTICATED"
            - "INVALID_CREDENTIALS"
            - "DEMO_EXPIRED"
            - "CSRF_INVALID"
            - "CUSTOMER_NOT_FOUND"
            - "PAYMENT_NOT_FOUND"
            - "IDEMPOTENCY_KEY_REUSED"
            - "PAYMENT_FINAL_STATE"
            - "DEMO_LIMIT_REACHED"
            - "RATE_LIMITED"
            - "CONTENTION_TIMEOUT"
            - "DEMO_CAPACITY_REACHED"
            - "UNSUPPORTED_MEDIA_TYPE"
            - "METHOD_NOT_ALLOWED"
            - "INTERNAL_ERROR"
        requestId:
          type: "string"
          format: "uuid"
        fieldErrors:
          type: "array"
          items:
            "$ref": "#/components/schemas/FieldError"
