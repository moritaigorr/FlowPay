# Canonical HTTP contract; planned behavior, not execution evidence.
openapi: "3.0.3"
info:
  title: "FlowPay Simulation API"
  version: "1.0.0"
  description: "Contract-first personal portfolio simulator, no real money/card/bank data. Planned behavior, not implementation evidence. JSON camelCase, UUID IDs, UTC instants (offset required on input, Z output). Request objects reject unknown fields; documented parameter values are validated. Clients use only documented query parameters and do not send bodies on bodyless operations. API JSON Cache-Control:no-store. CSRF precedes business auth on writes, so 403 can precede 401. Java API errors use the problem envelope; proxy/network failures may be non-JSON and lack requestId. Java/operational details in module-contracts.md."
servers:
  -
    url: "/"
    description: "Same origin; paths include /api/v1."
security:
  -
    sessionCookie: []
tags:
  -
    name: "auth"
    description: "Session identity and CSRF lifecycle."
  -
    name: "demo"
    description: "Isolated synthetic demo provisioning."
  -
    name: "company"
    description: "Authenticated company information."
  -
    name: "customers"
    description: "Company-owned customer creation and lookup."
  -
    name: "payments"
    description: "Simulated payments, response replay and immutable history."
  -
    name: "dashboard"
    description: "Creation-cohort metrics using current status."
  -
    name: "documentation"
    description: "Public read-only maintained API documentation."
paths:
  "/api/v1/auth/csrf":
    get:
      operationId: "getCsrfToken"
      tags:
        - "auth"
      summary: "Get CSRF token"
      description: "May initialize anonymous session. Keep token in memory, send unchanged in named header. Re-fetch after login/demo/logout which clear previous token."
      security: []
      parameters: []
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Set-Cookie:
              description: "SESSION=<opaque>; Path=/; HttpOnly; SameSite=Lax; Secure in production. Browser-managed; 30-minute inactivity timeout. Login/demo rotate ID; logout expires cookie. Never persisted in idempotency record."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CsrfToken"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/auth/login":
    post:
      operationId: "login"
      tags:
        - "auth"
      summary: "Log in conventional operator"
      description: "Normalize email; verify password hash; rotate session ID and clear CSRF token. Client fetches fresh CSRF. No public conventional signup."
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Success."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Set-Cookie:
              description: "SESSION=<opaque>; Path=/; HttpOnly; SameSite=Lax; Secure in production. Browser-managed; 30-minute inactivity timeout. Login/demo rotate ID; logout expires cookie. Never persisted in idempotency record."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          description: "INVALID_CREDENTIALS: Generic wrong credentials/demo identity response; do not reveal account existence."
          headers:
            X-Request-Id:
              description: "Fresh server-generated UUID on every response, including replay/errors; do not trust incoming IDs."
              schema:
                type: "string"
                format: "uuid"
            Cache-Control:
              description: "Do not cache API identity or business JSON."
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/auth/me":
    get:
      operationId: "getSession"
      tags:
        - "auth"
      summary: "Get authenticated identity"
      description: "Get authenticated identity"
      parameters: []
      responses:
        "200":
          description: "Success."
