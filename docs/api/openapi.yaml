              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "405":
          "$ref": "#/components/responses/MethodNotAllowed"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/auth/logout":
    post:
      operationId: "logout"
      tags:
        - "auth"
      summary: "Invalidate session"
      description: "Requires authenticated active company and CSRF. No body. Invalidate session and expire cookie; clear identity/cache then obtain anonymous CSRF before next entry."
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      responses:
        "204":
          description: "Success."
          headers:
